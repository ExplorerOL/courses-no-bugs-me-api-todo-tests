[project]
name = "api_course_hometasks"
version = "1.0.0"
description = "Tasks for API architecture courses"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "allure-pytest>=2.14.3",
    "pytest>=8.4.1",
    "pytest-base-url>=2.1.0",
    "requests>=2.32.4",
    "ruff>=0.12.3",
]

testpaths = [
    "tests",
]

[tool.pytest.ini_options]
addopts = "--junitxml=./reports/report-WebScadaMT-last.xml --alluredir ./reports/allure-results --clean-alluredir"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".venv*",
]

# Same as Black.
line-length = 110
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["I"]
fixable = ["ALL"]
